
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Login | ProcureTrack</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #174c2b, #6aab70);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .login-container {
            background: white;
            width: 100%;
            max-width: 420px;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 8px 25px #00000030;
        }

        .logo {
            text-align: center;
            font-size: 27px;
            color: #236b3b;
            margin-bottom: 8px;
        }

        .icon {
            text-align: center;
            font-size: 55px;
            margin: 15px 0;
        }

        h2 {
            text-align: center;
            color: #26352b;
            margin-bottom: 8px;
        }

        .description {
            text-align: center;
            color: #777;
            margin-bottom: 25px;
            font-size: 14px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
            color: #333;
        }

        input {
            width: 100%;
            padding: 13px;
            margin-bottom: 18px;
            border: 1px solid #ccc;
            border-radius: 7px;
            font-size: 15px;
        }

        input:focus {
            outline: none;
            border-color: #236b3b;
        }

        button {
            width: 100%;
            padding: 14px;
            background: #236b3b;
            color: white;
            border: none;
            border-radius: 7px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #174c2b;
        }

        #message {
            text-align: center;
            margin-top: 15px;
            font-size: 14px;
            font-weight: bold;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 22px;
            color: #236b3b;
            text-decoration: none;
        }

        .back-link:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

    <div class="login-container">

        <div class="logo">🌱 ProcureTrack</div>

        <div class="icon">🛡️</div>

        <h2>Admin Login</h2>

        <p class="description">
            Sign in to manage the ProcureTrack system.
        </p>

        <form id="adminLoginForm">

            <label for="username">Admin Username</label>
            <input
                type="text"
                id="username"
                placeholder="Enter admin username"
                required
            >

            <label for="password">Password</label>
            <input
                type="password"
                id="password"
                placeholder="Enter password"
                required
            >

            <button type="submit">Login to Dashboard</button>

        </form>

        <p id="message"></p>

        <a href="index.html" class="back-link">
            ← Back to Homepage
        </a>

    </div>

    <script>

        document.getElementById("adminLoginForm")
            .addEventListener("submit", function(event) {

                event.preventDefault();

                const username =
                    document.getElementById("username").value.trim();

                const password =
                    document.getElementById("password").value;

                const message =
                    document.getElementById("message");

                // Demonstration credentials only.
                if (
                    username === "admin" &&
                    password === "PTAdmin@2026"
                ) {

                    sessionStorage.setItem("userRole", "admin");

                    message.style.color = "green";
                    message.textContent = "Login successful!";

                    window.location.href = "admin.html";

                } else {

                    message.style.color = "red";
                    message.textContent =
                        "Invalid username or password.";

                }

            });

    </script>

</body>
</html>
