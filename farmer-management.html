
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Farmer Management | ProcureTrack</title>

<script>
if (sessionStorage.getItem("userRole") !== "admin") {
    window.location.replace("admin-login.html");
}
</script>

<style>
* { box-sizing: border-box; }

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f3f6f3;
    color: #26352b;
}

header {
    background: #236b3b;
    color: white;
    padding: 22px;
}

.container {
    max-width: 1100px;
    margin: auto;
    padding: 22px;
}

.topbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 12px;
}

a, button {
    cursor: pointer;
}

.back, .logout {
    padding: 10px 15px;
    border-radius: 6px;
    text-decoration: none;
    border: none;
    font-weight: bold;
}

.back {
    background: white;
    color: #236b3b;
}

.logout {
    background: #a83232;
    color: white;
}

.search {
    width: 100%;
    padding: 13px;
    border: 1px solid #ccc;
    border-radius: 7px;
    margin: 20px 0;
    font-size: 15px;
}

.stats {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 15px;
}

.card {
    background: white;
    padding: 20px;
    border-radius: 10px;
    box-shadow: 0 3px 10px #00000010;
    margin-bottom: 15px;
}

.card h3 {
    color: #236b3b;
}

.stat-number {
    font-size: 28px;
    font-weight: bold;
    color: #236b3b;
}

table {
    width: 100%;
    border-collapse: collapse;
    min-width: 600px;
}

th, td {
    padding: 12px;
    text-align: left;
    border-bottom: 1px solid #ddd;
}

th {
    background: #eaf5ed;
    color: #236b3b;
}

.table-wrap {
    overflow-x: auto;
}

.empty {
    color: #777;
    padding: 15px;
}

footer {
    text-align: center;
    padding: 20px;
    color: #777;
}
</style>
</head>

<body>

<header>
    <h1>🌾 Farmer Management</h1>
    <p>Manage farmer information, products and procurement bookings.</p>
</header>

<div class="container">

    <div class="topbar">
        <h2>Farmer Overview</h2>
        <div>
            <a href="admin.html" class="back">← Dashboard</a>
            <button class="logout" onclick="logout()">Logout</button>
        </div>
    </div>

    <div class="stats">
        <div class="card">
            <h3>Total Farmers</h3>
            <div class="stat-number" id="totalFarmers">0</div>
        </div>

        <div class="card">
            <h3>Total Products</h3>
            <div class="stat-number" id="totalProducts">0</div>
        </div>

        <div class="card">
            <h3>Total Bookings</h3>
            <div class="stat-number" id="totalBookings">0</div>
        </div>
    </div>

    <input
        type="text"
        id="search"
        class="search"
        placeholder="Search farmer by name..."
        oninput="displayFarmers()"
    >

    <div id="farmerList"></div>

</div>

<footer>
    ProcureTrack © 2026 | QUANTUM LEAPERS
</footer>

<script>

function readData(key) {
    try {
        const data = JSON.parse(localStorage.getItem(key) || "[]");
        return Array.isArray(data) ? data : [];
    } catch {
        return [];
    }
}

function safe(value) {
    return String(value ?? "-").replace(/[&<>"']/g, char => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
    })[char]);
}

function getFarmers() {

    const products = readData("procureTrackProducts");
    const bookings = readData("procureTrackBookings");

    const farmers = {};

    products.forEach(product => {
        const name = (product.farmerName || "").trim();

        if (!name) return;

        const key = name.toLowerCase();

        if (!farmers[key]) {
            farmers[key] = {
                name: name,
                products: [],
                bookings: []
            };
        }

        farmers[key].products.push(product);
    });

    bookings.forEach(booking => {
        const name = (booking.farmerName || "").trim();

        if (!name) return;

        const key = name.toLowerCase();

        if (!farmers[key]) {
            farmers[key] = {
                name: name,
                products: [],
                bookings: []
            };
        }

        farmers[key].bookings.push(booking);
    });

    return Object.values(farmers);
}

function displayFarmers() {

    const farmers = getFarmers();
    const search = document.getElementById("search").value
        .trim().toLowerCase();

    document.getElementById("totalFarmers").textContent =
        farmers.length;

    document.getElementById("totalProducts").textContent =
        readData("procureTrackProducts").length;

    document.getElementById("totalBookings").textContent =
        readData("procureTrackBookings").length;

    const filtered = farmers.filter(farmer =>
        farmer.name.toLowerCase().includes(search)
    );

    const container = document.getElementById("farmerList");

    if (filtered.length === 0) {
        container.innerHTML = `
            <div class="card empty">
                No farmer records found.
            </div>
        `;
        return;
    }

    container.innerHTML = filtered.map((farmer, index) => `

        <div class="card">

            <h3>👨‍🌾 ${safe(farmer.name)}</h3>

            <p><strong>Products Listed:</strong>
                ${farmer.products.length}
            </p>

            <p><strong>Procurement Bookings:</strong>
                ${farmer.bookings.length}
            </p>

            <h4>Product Details</h4>

            ${farmer.products.length ? `
                <div class="table-wrap">
                <table>
                    <thead>
                        <tr>
                            <th>Product</th>
                            <th>Quantity</th>
                            <th>Price / Kg</th>
                            <th>Quality</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${farmer.products.map(product => `
                            <tr>
                                <td>${safe(product.name || product.productName)}</td>
                                <td>${safe(product.quantity)} Kg</td>
                                <td>₹${safe(product.price)}</td>
                                <td>${safe(product.quality)}</td>
                            </tr>
                        `).join("")}
                    </tbody>
                </table>
                </div>
            ` : `<p class="empty">No products listed.</p>`}

            <h4>Procurement Bookings</h4>

            ${farmer.bookings.length ? `
                <div class="table-wrap">
                <table>
                    <thead>
                        <tr>
                            <th>Booking ID</th>
                            <th>Crop</th>
                            <th>Centre</th>
                            <th>Date</th>
                            <th>Status</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${farmer.bookings.map(booking => `
                            <tr>
                                <td>${safe(booking.bookingId || booking.id)}</td>
                                <td>${safe(booking.cropName || booking.crop)}</td>
                                <td>${safe(booking.centre)}</td>
                                <td>${safe(booking.date)}</td>
                                <td>${safe(booking.status)}</td>
                            </tr>
                        `).join("")}
                    </tbody>
                </table>
                </div>
            ` : `<p class="empty">No procurement bookings.</p>`}

        </div>

    `).join("");
}

function logout() {
    sessionStorage.removeItem("userRole");
    window.location.replace("admin-login.html");
}

displayFarmers();

window.addEventListener("storage", displayFarmers);

</script>

</body>
</html>
