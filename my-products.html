
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Products - ProcureTrack</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f3f6f3;
            margin: 0;
            padding: 25px;
            color: #26352b;
        }

        .container {
            max-width: 1000px;
            margin: auto;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
        }

        h1 {
            color: #236b3b;
        }

        .products {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 18px;
            margin-top: 25px;
        }

        .product {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 3px 12px #00000012;
        }

        .product h3 {
            color: #236b3b;
        }

        button, .link {
            display: inline-block;
            background: #236b3b;
            color: white;
            border: 0;
            padding: 10px 15px;
            border-radius: 6px;
            cursor: pointer;
            text-decoration: none;
            margin-top: 10px;
        }

        .delete {
            background: #c0392b;
        }

        .empty {
            background: white;
            padding: 25px;
            border-radius: 10px;
            margin-top: 25px;
        }

        .price {
            font-size: 18px;
            font-weight: bold;
            color: #236b3b;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="header">
        <h1>🌾 My Products</h1>
        <a class="link" href="FARMER.HTML">Back to Dashboard</a>
    </div>

    <p>View and manage your registered farm products.</p>

    <div id="productList" class="products"></div>

</div>

<script>

    function escapeHTML(value) {
        return String(value ?? "-").replace(/[&<>"']/g, character => ({
            "&": "&amp;",
            "<": "&lt;",
            ">": "&gt;",
            '"': "&quot;",
            "'": "&#39;"
        })[character]);
    }

    function displayProducts() {

        const products = JSON.parse(
            localStorage.getItem("procureTrackProducts") || "[]"
        );

        const productList = document.getElementById("productList");

        if (products.length === 0) {

            productList.innerHTML = `
                <div class="empty">
                    <h3>No Products Registered Yet</h3>
                    <p>Please add your agricultural products.</p>
                    <a class="link" href="product.html">Add Product</a>
                </div>
            `;

            return;
        }

        productList.innerHTML = products.map((product, index) => {

            const productName =
                product.name || product.productName || "Unnamed Product";

            return `
                <div class="product">

                    <h3>🌱 ${escapeHTML(productName)}</h3>

                    <p>
                        <b>Category:</b>
                        ${escapeHTML(product.category)}
                    </p>

                    <p>
                        <b>Quantity:</b>
                        ${escapeHTML(product.quantity)} kg
                    </p>

                    <p class="price">
                        ₹${escapeHTML(product.price)} / kg
                    </p>

                    <p>
                        <b>Quality:</b>
                        ${escapeHTML(product.quality)}
                    </p>

                    <p>
                        <b>Location:</b>
                        ${escapeHTML(product.location)}
                    </p>

                    <p>
                        <b>Description:</b>
                        ${escapeHTML(product.description || "No description")}
                    </p>

                    <button class="delete"
                        onclick="deleteProduct(${index})">
                        Delete Product
                    </button>

                </div>
            `;

        }).join("");
    }

    function deleteProduct(index) {

        if (!confirm("Are you sure you want to delete this product?")) {
            return;
        }

        const products = JSON.parse(
            localStorage.getItem("procureTrackProducts") || "[]"
        );

        products.splice(index, 1);

        localStorage.setItem(
            "procureTrackProducts",
            JSON.stringify(products)
        );

        displayProducts();
    }

    displayProducts();

</script>

</body>
</html>
