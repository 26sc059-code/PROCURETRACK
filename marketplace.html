
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Marketplace | ProcureTrack</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f3f6f3;
            margin: 0;
            padding: 25px;
            color: #26352b;
        }

        .container {
            max-width: 1100px;
            margin: auto;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
        }

        h1 { color: #236b3b; }

        .back {
            background: #236b3b;
            color: white;
            padding: 10px 15px;
            border-radius: 6px;
            text-decoration: none;
        }

        .customer-box {
            background: white;
            padding: 20px;
            border-radius: 12px;
            margin-top: 20px;
        }

        input {
            padding: 11px;
            width: 100%;
            max-width: 350px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
        }

        .products {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-top: 25px;
        }

        .product {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 3px 12px #00000012;
        }

        .product h3 { color: #236b3b; }

        .product button {
            background: #236b3b;
            color: white;
            border: none;
            padding: 11px 16px;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 12px;
        }

        .product button:hover { background: #174c29; }

        .quantity {
            width: 100px;
            margin-top: 8px;
        }

        .empty {
            background: white;
            padding: 25px;
            border-radius: 10px;
        }

        .price {
            color: #236b3b;
            font-size: 18px;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="header">
        <h1>🛒 Customer Marketplace</h1>
        <a href="customer.html" class="back">Back to Dashboard</a>
    </div>

    <p>Discover fresh agricultural products directly from farmers.</p>

    <div class="customer-box">
        <h3>Customer Details</h3>

        <label for="customerName">Your Name</label><br><br>

        <input type="text"
               id="customerName"
               placeholder="Enter your full name"
               required>
    </div>

    <div id="productList" class="products"></div>

</div>

<script>

    // Get customer name from login
    document.getElementById("customerName").value =
        sessionStorage.getItem("customerName") || "";

    // Protect displayed text
    function escapeHTML(value) {
        return String(value ?? "-").replace(/[&<>"']/g, character => ({
            "&": "&amp;",
            "<": "&lt;",
            ">": "&gt;",
            '"': "&quot;",
            "'": "&#39;"
        })[character]);
    }

    // Display available products
    function displayProducts() {

        const products = JSON.parse(
            localStorage.getItem("procureTrackProducts") || "[]"
        );

        const productList = document.getElementById("productList");

        if (products.length === 0) {

            productList.innerHTML = `
                <div class="empty">
                    <h3>No Products Available</h3>
                    <p>Farmers have not registered any products yet.</p>
                </div>
            `;

            return;
        }

        productList.innerHTML = products.map((product, index) => {

            // IMPORTANT: Product name is saved as "name"
            const productName =
                product.name || product.productName || "Unnamed Product";

            return `
                <div class="product">

                    <h3>🌱 ${escapeHTML(productName)}</h3>

                    <p><b>Category:</b>
                        ${escapeHTML(product.category)}
                    </p>

                    <p class="price">
                        ₹${escapeHTML(product.price)} / kg
                    </p>

                    <p><b>Available Quantity:</b>
                        ${escapeHTML(product.quantity)} kg
                    </p>

                    <p><b>Quality:</b>
                        ${escapeHTML(product.quality)}
                    </p>

                    <p><b>Location:</b>
                        ${escapeHTML(product.location)}
                    </p>

                    <p><b>Description:</b>
                        ${escapeHTML(product.description || "No description")}
                    </p>

                    <label>Order Quantity (kg)</label><br>

                    <input
                        class="quantity"
                        type="number"
                        id="quantity-${index}"
                        min="1"
                        step="any"
                        max="${Number(product.quantity)}"
                        placeholder="Kg">

                    <br>

                    <button onclick="placeOrder(${index})">
                        Place Order
                    </button>

                </div>
            `;

        }).join("");
    }

    // Place customer order
    function placeOrder(index) {

        const customerName =
            document.getElementById("customerName").value.trim();

        if (!customerName) {
            alert("Please enter your name.");
            return;
        }

        const products = JSON.parse(
            localStorage.getItem("procureTrackProducts") || "[]"
        );

        const product = products[index];

        if (!product) {
            alert("Product not found.");
            return;
        }

        const productName =
            product.name || product.productName || "Unnamed Product";

        const quantity = Number(
            document.getElementById("quantity-" + index).value
        );

        const available = Number(product.quantity);
        const price = Number(product.price);

        if (!Number.isFinite(quantity) || quantity <= 0) {
            alert("Please enter a valid order quantity.");
            return;
        }

        if (!Number.isFinite(available) || available <= 0) {
            alert("This product is currently unavailable.");
            return;
        }

        if (quantity > available) {
            alert("Requested quantity is more than available stock.");
            return;
        }

        if (!Number.isFinite(price) || price <= 0) {
            alert("This product has an invalid price.");
            return;
        }

        const total = quantity * price;

        const orders = JSON.parse(
            localStorage.getItem("procureTrackOrders") || "[]"
        );

        const newOrder = {

            id: Date.now(),

            productName: productName,

            productId: product.id,

            customerName: customerName,

            quantity: quantity,

            price: price,

            total: total,

            farmerName: product.farmerName || "Farmer",

            status: "Pending",

            createdAt: new Date().toISOString()
        };

        orders.push(newOrder);

        localStorage.setItem(
            "procureTrackOrders",
            JSON.stringify(orders)
        );

        alert(
            "Order placed successfully!\n\n" +
            "Product: " + productName +
            "\nQuantity: " + quantity + " kg" +
            "\nPrice: ₹" + price + " / kg" +
            "\nTotal: ₹" + total.toFixed(2) +
            "\nStatus: Pending"
        );

        document.getElementById("quantity-" + index).value = "";

    }

    // Load products when page opens
    displayProducts();

</script>

</body>
</html>
